[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai"
version = "0.1.0"
description = "Stateful agent inference gateway."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cachetools==5.5.2",
    "fastapi==0.115.12",
    "pydantic==2.11.3",
    "transformers==4.51.3",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bonsai*"]
